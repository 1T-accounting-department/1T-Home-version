button,.in{transition:background-color .15s,border-color .15s,opacity .15s,transform .08s}
button:active{transform:scale(.96)}
.card{transition:background-color .15s}
.card:active{background:var(--panel)}
#app{opacity:1;transition:opacity .14s ease}
#app.f{opacity:0}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--head);color:#fff;border-bottom:1px solid var(--acc2)}

main{padding:0 0 180px;max-width:640px;margin:auto}
h3{margin:0;padding:6px 10px;background:var(--panel);color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.in{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:2px;background:var(--card);color:var(--ink);font:inherit;margin:8px 10px 8px 0;max-width:calc(100% - 20px)}
.toolbar{padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.toolbar .in{margin:0}
.card{background:var(--card);border-bottom:1px solid var(--line);padding:9px 12px;margin:0}
.it{display:flex;align-items:center;gap:10px;justify-content:space-between}
.it small,.mut{color:var(--mut);display:block;font-size:12px}
.low{color:var(--r);font-weight:700}
.b{background:var(--acc);color:#fff;border:1px solid var(--acc2);border-radius:2px;padding:10px 14px;font:inherit;font-weight:600;font-size:13px}
.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}.del{background:var(--r);border-color:#7E1E16;color:#fff}
.st{display:flex;align-items:center;gap:6px;font-weight:700}
.st button{width:30px;height:30px;border-radius:2px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.grid .card{border-right:1px solid var(--line);border-bottom:0}.grid .card:last-child{border-right:0}
.grid b{font-size:14px;display:block;margin:2px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--head);border-top:1px solid var(--acc2);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-right:1px solid var(--acc2);background:none;color:#9FB2CC;padding:12px 0;font:inherit;font-size:12px}
nav button:last-child{border-right:0}
nav button.on{color:#fff;font-weight:700;background:var(--acc2)}
#cart{position:fixed;left:0;right:0;bottom:calc(45px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;max-width:640px;margin:auto;transform:translateY(100%);opacity:0;pointer-events:none;transition:transform .18s ease,opacity .18s ease}
#cart.show{transform:translateY(0);opacity:1;pointer-events:auto}
#t{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-12px);background:var(--head);color:#fff;padding:8px 14px;border-radius:2px;z-index:99;max-width:90vw;font-size:13px;border:1px solid var(--acc2);opacity:0;pointer-events:none;transition:transform .18s ease,opacity .18s ease}
#t.show{transform:translateX(-50%) translateY(0);opacity:1}
dialog{border:1px solid var(--line);border-radius:2px;padding:14px;width:min(92vw,420px);background:var(--card);color:var(--ink);opacity:0;transform:translateY(8px) scale(.98);transition:opacity .14s ease,transform .14s ease}
dialog[open]{opacity:1;transform:translateY(0) scale(1)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{background:none;border:0;padding:0;margin:0 0 10px;color:var(--ink);font-size:14px;text-transform:none;letter-spacing:0}
label{display:block;font-size:12px;color:var(--mut);margin-top:4px}
.row{display:flex;gap:8px;margin-top:10px}.row .b{flex:1}
#splash{position:fixed;inset:0;background:#003C9E;display:flex;align-items:center;justify-content:center;z-index:999;transition:opacity .25s ease}

#splash.hide{opacity:0;pointer-events:none}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.85}}

const K='1t-db',E=()=>({products:[],clients:[],sales:[],rates:{UAH:1,USD:42,EUR:45,CNY:5.8}});
function migrate(){
  db.rates=Object.assign({UAH:1,USD:42,EUR:45,CNY:5.8},db.rates||{});
  (db.products||[]).forEach(p=>{if(!p.cur)p.cur='UAH';if(p.note==null)p.note=''});
  if(!db.lang)db.lang='ru';
  if(!db.archive)db.archive=[];
  checkArchive();
}
function checkArchive(){
  const now=Date.now();
  const before=db.archive.length;
  db.archive=db.archive.filter(a=>!a.due||new Date(a.due+'T23:59:59').getTime()>=now);
  if(db.archive.length!==before)try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}
}
let db=(()=>{try{return JSON.parse(localStorage.getItem(K))||E()}catch(e){return E()}})();

/* ---------- Синхронизация прогресса в Телеграм-боте ---------- */
/* Внутри мини-приложения бота Телеграм сам даёт user_id текущего человека —
   под этим же id и хранится его прогресс. Видно и ожидаемо, как в любой игре с сохранением. */
const TG=window.Telegram&&window.Telegram.WebApp;
const TG_ID=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user&&TG.initDataUnsafe.user.id;
const FB_URL='https://ВАШ-ПРОЕКТ-default-rtdb.firebaseio.com'; // замени на адрес своей базы из Firebase
async function cloudLoad(){
  if(!TG_ID)return; // открыто не через бота — работаем только локально
  try{const r=await fetch(FB_URL+'/users/'+TG_ID+'.json');const d=await r.json();if(d){db=d;migrate()}}catch(e){}
}
function cloudSave(){
  if(!TG_ID)return;
  fetch(FB_URL+'/users/'+TG_ID+'.json',{method:'PUT',body:JSON.stringify(db)}).catch(()=>{});
}
function toast(m){const t=$('#t');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)}
function dlg(title,body,ok,onOk,onDel,extra){
  const d=$('#d');
  d.innerHTML=`<form><h3 style="margin-top:0">${title}</h3>${body}<div class="row"><button type="button" class="b sec" data-c>${t('btn_cancel')}</button>${onDel?`<button type="button" class="b del" data-x>${t('btn_delete')}</button>`:''}${extra?`<button type="button" class="b sec" data-e>${extra.label}</button>`:''}<button class="b">${ok}</button></div></form>`;
  const f=d.querySelector('form');
  f.onsubmit=e=>{e.preventDefault();if(onOk(new FormData(f))!==false)d.close()};
  f.querySelector('[data-c]').onclick=()=>d.close();
  if(onDel)f.querySelector('[data-x]').onclick=()=>{if(confirm(t('btn_delete')+'?')){onDel();d.close()}};
  if(extra)f.querySelector('[data-e]').onclick=()=>extra.run(new FormData(f),f);
  d.showModal();
  const first=f.querySelector('input,select');
  if(first)setTimeout(()=>{first.focus();if(first.select)first.select()},50);
}

const items=()=>Object.entries(cart).map(([id,n])=>({p:db.products.find(x=>x.id===id),n})).filter(x=>x.p&&x.n>0);

function saleList(){

function qtyForm(id){
  const p=db.products.find(x=>x.id===id);if(!p)return;
  dlg(esc(p.name),`<p class="mut" style="margin:0 0 8px">${t('lbl_qty')}: ${p.qty}</p><label>${t('lbl_qty')}<input class="in" name="n" type="number" step="1" min="0" max="${p.qty}" inputmode="numeric" required value="${cart[id]||0}"></label>`,t('btn_confirm'),fd=>{

}

function cartBar(){

  el.innerHTML=`<div><b>${money(total())}</b><small class="mut">${n.length}</small></div><div class="row" style="margin:0;gap:6px"><button class="b sec" style="width:auto;padding:10px 12px" data-clr>${t('btn_clear')}</button><button class="b" style="width:auto" data-co>${t('btn_checkout')}</button></div>`;

function checkout(){
  const it=items(),sum=total();
  dlg(t('title_confirm_sale'),`${it.map(x=>`<div class="it"><span>${esc(x.p.name)} × ${x.n}</span><b>${money(priceUAH(x.p)*x.n)}</b></div>`).join('')}<p><b>${money(sum)}</b></p><label>${t('lbl_client')}<select class="in" name="cl"><option value="">${t('opt_no_client')}</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>`,t('btn_confirm'),fd=>{
    const bad=it.find(x=>x.n>x.p.qty);
    if(bad){toast(t('h_low_stock')+': '+bad.p.name);return false}
    it.forEach(x=>x.p.qty-=x.n);
    db.sales.push({id:uid(),ts:Date.now(),cl:fd.get('cl'),items:it.map(x=>({pid:x.p.id,n:x.p.name,pr:priceUAH(x.p),q:x.n})),total:sum});

  });

}
function vCli(){return`<div class="toolbar row"><button class="b" style="width:auto" data-add="c">${t('btn_new_client')}</button></div><div class="toolbar"><input class="in" id="q" placeholder="${t('search_client')}" value="${esc(q)}"></div><div id="list">${cliList()}</div>`}
const CODES=[['+380','Украина'],['+48','Польша'],['+49','Германия'],['+420','Чехия'],['+421','Словакия'],['+1','США/Канада'],['+44','Великобритания'],['+39','Италия'],['+34','Испания'],['+33','Франция'],['+31','Нидерланды'],['+32','Бельгия'],['+43','Австрия'],['+41','Швейцария'],['+351','Португалия'],['+353','Ирландия'],['+46','Швеция'],['+47','Норвегия'],['+45','Дания'],['+358','Финляндия'],['+30','Греция'],['+40','Румыния'],['+359','Болгария'],['+36','Венгрия'],['+385','Хорватия'],['+386','Словения'],['+381','Сербия'],['+370','Литва'],['+371','Латвия'],['+372','Эстония'],['+373','Молдова'],['+375','Беларусь'],['+995','Грузия'],['+374','Армения'],['+994','Азербайджан'],['+90','Турция'],['+972','Израиль'],['+971','ОАЭ'],['+966','Саудовская Аравия'],['+86','Китай'],['+81','Япония'],['+82','Южная Корея'],['+91','Индия'],['+61','Австралия'],['+55','Бразилия'],['+52','Мексика'],['+27','ЮАР']];
function splitPhone(full){
  full=(full||'').trim();
  for(const[c]of CODES)if(full.startsWith(c))return{code:c,num:full.slice(c.length).replace(/\D/g,'')};
  return{code:'+380',num:full.replace(/\D/g,'')};
}
function cliForm(id){
  const ex=db.clients.find(x=>x.id===id),c=ex||{name:'',phone:''};
  const ph=splitPhone(c.phone);
  dlg(ex?t('title_edit_client'):t('title_new_client'),`<label>${t('lbl_client_name')}<input class="in" name="name" required value="${esc(c.name)}"></label><label>${t('lbl_phone')}</label><div class="row" style="margin:4px 0 10px"><select class="in" name="code" style="flex:0 0 128px;margin:0">${CODES.map(([c2,n])=>`<option value="${c2}" ${ph.code===c2?'selected':''}>${c2} ${n}</option>`).join('')}</select><input class="in" name="phone" type="tel" inputmode="numeric" style="margin:0" value="${esc(ph.num)}"></div>`,t('btn_save'),fd=>{
    const digits=fd.get('phone').trim().replace(/\D/g,'');
    const o={name:fd.get('name').trim(),phone:digits?fd.get('code')+digits:''};
    if(ex)Object.assign(ex,o);else db.clients.push({id:uid(),...o});
    save();go();
  },ex?()=>{db.clients=db.clients.filter(x=>x.id!==id);save();go()}:null);
}
/* ---------- Отчёты ---------- */
function sum(from){const s=db.sales.filter(x=>x.ts>=from);return{n:s.length,t:s.reduce((a,x)=>a+x.total,0)}}
function vRep(){
  const d=new Date();d.setHours(0,0,0,0);
  const ranges={today:d.getTime(),week:d.getTime()-6*864e5,all:0};
  const A=sum(ranges.today),B=sum(ranges.week),C=sum(ranges.all);
  const top={};db.sales.forEach(s=>s.items.forEach(i=>top[i.n]=(top[i.n]||0)+i.q));
  const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const low=db.products.filter(p=>p.qty<=p.min);
  const list=db.sales.filter(s=>s.ts>=ranges[repPeriod]).slice(-15).reverse();
  const box=(key,n,x)=>`<div class="card" data-rep="${key}" style="cursor:pointer${repPeriod===key?';background:var(--panel)':''}"><span class="mut">${n}</span><b>${money(x.t)}</b><span class="mut">${x.n}</span></div>`;
  return`<div class="grid">${box('today',t('period_today'),A)}${box('week',t('period_week'),B)}${box('all',t('period_all'),C)}</div>
  <h3>${t('h_low_stock')}</h3>${low.length?low.map(p=>`<div class="card it"><span>${esc(p.name)}</span><b class="low">${p.qty}</b></div>`).join(''):`<div class="card mut">${t('empty_search')}</div>`}
  <h3>${t('h_top')}</h3>${tp.length?tp.map(([n,q])=>`<div class="card it"><span>${esc(n)}</span><b>${q}</b></div>`).join(''):`<div class="card mut">${t('empty_search')}</div>`}
  <h3>${t('h_sales')} — ${{today:t('period_today'),week:t('period_week'),all:t('period_all')}[repPeriod]}</h3>${list.length?list.map(s=>`<div class="card it"><div><b>${money(s.total)}</b><small>${fmt(s.ts)}${s.cl?' · '+esc((db.clients.find(c=>c.id===s.cl)||{}).name||''):''}</small></div><span class="mut">${s.items.reduce((a,i)=>a+i.q,0)}</span></div>`).join(''):`<div class="card mut">${t('empty_search')}</div>`}
  <h3>${t('h_rates')}</h3><div class="card"><div class="row" style="flex-wrap:wrap">${['USD','EUR','CNY'].map(c=>`<span class="mut" style="flex:1 1 auto">${CUR[c].s} 1 ${c} = ${db.rates[c]} ₴</span>`).join('')}</div><div class="row"><button class="b sec" style="width:100%" data-rates>${t('btn_edit_rates')}</button></div></div>
  <h3>${t('h_db')}</h3><div class="card"><div class="row"><button class="b" data-exp>${t('btn_export')}</button><button class="b sec" data-imp>${t('btn_import')}</button></div></div>`;
}
function ratesForm(){
  dlg(t('h_rates'),`${['USD','EUR','CNY'].map(c=>`<label>${CUR[c].n} (${CUR[c].s})<input class="in" name="${c}" type="number" step="0.01" min="0.01" inputmode="decimal" required value="${db.rates[c]}"></label>`).join('')}`,t('btn_save'),fd=>{
    ['USD','EUR','CNY'].forEach(c=>{const v=+fd.get(c);if(v>0)db.rates[c]=v});
    save();go();
  });
}
function vSet(){
  const names=NAMES[lang]||NAMES.ru;
  return `<h3>${t('settings_lang_label')}</h3>${LANG_ORDER.map(c=>`<div class="card it" data-lang="${c}" style="cursor:pointer${lang===c?';background:var(--panel)':''}"><span>${names[c]}</span>${lang===c?'<b>✓</b>':''}</div>`).join('')}`;
}
function exportDb(){
  const b=new Blob([JSON.stringify(db)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='1T-база-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
$('#f').onchange=e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  file.text().then(t=>{
    const o=JSON.parse(t);
    if(!Array.isArray(o.products)||!Array.isArray(o.clients)||!Array.isArray(o.sales))throw 0;
    if(!confirm('Заменить текущую базу данными из файла?'))return;
    db=o;migrate();cart={};save();go();toast('База загружена');
  }).catch(()=>toast('Файл не похож на базу 1T'));
};
/* ---------- Общее ---------- */
function go(fade){
  const app=$('#app');
  const render=()=>{
    $('nav').innerHTML=TABS.map(k=>`<button data-tab="${k}" class="${k===tab?'on':''}">${t('nav_'+k)}</button>`).join('');
    app.innerHTML={sale:vSale,prod:vProd,arch:vArch,cli:vCli,rep:vRep,set:vSet}[tab]();
    cartBar();
    if(fade)requestAnimationFrame(()=>app.classList.remove('f'));
  };
  if(fade){app.classList.add('f');setTimeout(render,110)}else render();
}
function hap(){try{TG&&TG.HapticFeedback&&TG.HapticFeedback.impactOccurred('light')}catch(e){}}
document.addEventListener('input',e=>{
  if(e.target.id!=='q')return;
  q=e.target.value;
  const r={sale:saleList,prod:prodList,arch:archList,cli:cliList}[tab];
  if(r)$('#list').innerHTML=r();
});
document.addEventListener('click',e=>{
  const g=k=>{const el=e.target.closest('['+k+']');return el&&el.getAttribute(k)};
  let v;
  if(v=g('data-tab')){if(v!==tab){tab=v;q='';go(true);window.scrollTo(0,0)}}
  else if(v=g('data-inc')){const p=db.products.find(x=>x.id===v);if((cart[v]||0)<p.qty){cart[v]=(cart[v]||0)+1;hap()}else toast(t('h_low_stock'));$('#list').innerHTML=saleList();cartBar()}
  else if(v=g('data-dec')){if(cart[v]){cart[v]--;hap()}$('#list').innerHTML=saleList();cartBar()}
  else if(v=g('data-qty'))qtyForm(v);
  else if(g('data-clr')!==null){cart={};$('#list').innerHTML=saleList();cartBar()}
  else if(g('data-co')!==null)checkout();
  else if(v=g('data-stock'))stockForm(v);
  else if(v=g('data-ep'))prodForm(v);
  else if(v=g('data-ec'))cliForm(v);
  else if(v=g('data-add'))v==='p'?prodForm():v==='a'?archForm():cliForm();
  else if(v=g('data-mv'))moveToProduct(v);
  else if(v=g('data-ea'))archForm(v);
  else if(v=g('data-rep')){if(v!==repPeriod){repPeriod=v;go(true)}}
  else if(g('data-exp')!==null)exportDb();
  else if(g('data-imp')!==null)$('#f').click();
  else if(g('data-rates')!==null)ratesForm();
  else if(v=g('data-lang')){if(v!==lang){lang=v;db.lang=v;save();go(true)}}
});
if(TG){TG.ready();TG.expand()}
const splashStart=Date.now();
function hideSplash(){
  const el=$('#splash');if(!el)return;
  const wait=Math.max(0,300-(Date.now()-splashStart));
  setTimeout(()=>{el.classList.add('hide');setTimeout(()=>el.remove(),260)},wait);
}
(async()=>{await cloudLoad();go();hideSplash()})();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
